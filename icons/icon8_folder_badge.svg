<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="amberBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="amberFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Folder Back Cover -->
  <path d="M 36 64 C 36 53 45 44 56 44 L 98 44 C 106 44 113 48 117 54 L 132 72 L 204 72 C 215 72 224 81 224 92 L 224 184 C 224 195 215 204 204 204 L 56 204 C 45 204 36 195 36 184 Z"
        fill="url(#amberBack)"/>

  <!-- Inner Multi-Tabs protruding from folder -->
  <!-- Tab 1 -->
  <rect x="54" y="58" width="56" height="34" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <rect x="62" y="66" width="30" height="4" rx="2" fill="#0284C7"/>
  <!-- Tab 2 -->
  <rect x="116" y="58" width="56" height="34" rx="8" fill="#FEF3C7" opacity="0.9"/>
  <rect x="124" y="66" width="24" height="4" rx="2" fill="#D97706"/>

  <!-- Folder Front Flap -->
  <path d="M 36 98 C 36 88 44 80 54 80 L 206 80 C 216 80 224 88 224 98 L 224 184 C 224 195 215 204 204 204 L 56 204 C 45 204 36 195 36 184 Z"
        fill="url(#amberFront)"/>
  
  <!-- Subtle Front Lip Accent -->
  <line x1="38" y1="99" x2="222" y2="99" stroke="#FDE68A" stroke-width="2" opacity="0.6"/>

  <!-- Embedded Mini Multi-Window Preview in Folder -->
  <g transform="translate(62, 118)">
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#FFFFFF" opacity="0.25"/>
    <line x1="0" y1="14" x2="80" y2="14" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <rect x="6" y="5" width="22" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="32" y="5" width="22" height="5" rx="2.5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Router Badge (Bottom Right overlay) -->
  <g filter="url(#badgeShadow)">
    <circle cx="184" cy="168" r="44" fill="#FFFFFF"/>
    <circle cx="184" cy="168" r="38" fill="url(#badgeBlue)"/>
    
    <!-- Router Convergence/Cross Icon inside badge -->
    <!-- Two converging routing arrows pointing right into one line -->
    <path d="M 164 154 L 176 168 L 194 168" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="198,168 188,162 188,174" fill="#FFFFFF"/>

    <path d="M 164 182 L 176 168" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <circle cx="164" cy="154" r="3.5" fill="#FFFFFF"/>
    <circle cx="164" cy="182" r="3.5" fill="#38BDF8"/>
  </g>
</svg>
