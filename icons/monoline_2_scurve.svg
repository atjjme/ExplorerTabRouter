<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="scurveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Window Contour -->
  <rect x="36" y="44" width="184" height="168" rx="32"
        fill="none" stroke="url(#scurveGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Tab Bar Dividing Line -->
  <line x1="36" y1="96" x2="220" y2="96" stroke="url(#scurveGrad)" stroke-width="12"/>

  <!-- Tab 1 & Tab 2 Dividing Notch -->
  <line x1="128" y1="44" x2="128" y2="96" stroke="url(#scurveGrad)" stroke-width="12"/>

  <!-- Tab 1 Indicator: Minimalist Folder Dash -->
  <line x1="68" y1="70" x2="96" y2="70" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round"/>

  <!-- Tab 2 (Target Routed Tab): Active Indicator Dot & Plus -->
  <circle cx="174" cy="70" r="8" fill="#818CF8"/>

  <!-- The S-Curve Monoline Path -->
  <!-- Starts gracefully from outside/bottom-left, enters window, swoops in an S-shape and targets Tab 2 -->
  <path d="M 60 186 C 88 186 96 150 128 150 C 160 150 174 130 174 108"
        fill="none" stroke="url(#scurveGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target Arrowhead at top pointing directly into Tab 2 -->
  <polygon points="174,96 163,114 185,114" fill="#818CF8"/>

  <!-- Entry Origin Dot -->
  <circle cx="60" cy="186" r="6" fill="#0EA5E9"/>
</svg>
