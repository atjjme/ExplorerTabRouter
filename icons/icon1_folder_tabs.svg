<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tabActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tabInactive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background base folder body -->
  <g filter="url(#dropShadow)">
    <!-- Folder Tab back plate -->
    <path d="M 32 80 C 32 66.7 42.7 56 56 56 L 96 56 C 103 56 109.8 59 114.4 64.4 L 128 80 L 200 80 C 213.3 80 224 90.7 224 104 L 224 196 C 224 209.3 213.3 220 200 220 L 56 220 C 42.7 220 32 209.3 32 196 Z"
          fill="url(#folderGrad)"/>

    <!-- Inactive Tab -->
    <path d="M 134 84 L 198 84 C 204.6 84 210 89.4 210 96 L 210 116 L 126 116 L 126 96 C 126 89.4 129.6 84 134 84 Z"
          fill="url(#tabInactive)" opacity="0.9"/>

    <!-- Active Tab (Front) -->
    <path d="M 54 72 L 126 72 C 132.6 72 138 77.4 138 84 L 138 120 L 46 120 L 46 84 C 46 77.4 49.6 72 54 72 Z"
          fill="url(#tabActive)"/>
    <!-- Active tab mini icon indicator -->
    <rect x="62" y="92" width="16" height="12" rx="3" fill="#3B82F6" />
    <rect x="84" y="95" width="36" height="6" rx="3" fill="#94A3B8" />

    <!-- Folder Front Cover (Slightly lowered, modern glass/flat feel) -->
    <path d="M 32 112 C 32 101 41 92 52 92 L 204 92 C 215 92 224 101 224 112 L 224 196 C 224 209.3 213.3 220 200 220 L 56 220 C 42.7 220 32 209.3 32 196 Z"
          fill="url(#folderGrad)" opacity="0.95"/>

    <!-- Front tab separation line & highlight -->
    <line x1="34" y1="112" x2="222" y2="112" stroke="#93C5FD" stroke-width="2" opacity="0.6"/>

    <!-- Tab divider indicator badge in folder center -->
    <g transform="translate(92, 138)">
      <!-- Tab 1 mini pill -->
      <rect x="0" y="0" width="32" height="24" rx="6" fill="#FFFFFF" opacity="0.95"/>
      <rect x="6" y="8" width="20" height="4" rx="2" fill="#2563EB"/>
      <rect x="6" y="14" width="12" height="3" rx="1.5" fill="#93C5FD"/>

      <!-- Tab 2 mini pill -->
      <rect x="40" y="0" width="32" height="24" rx="6" fill="#93C5FD" opacity="0.4"/>
      <rect x="46" y="8" width="18" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>

      <!-- Add '+' mini button -->
      <circle cx="86" cy="12" r="8" fill="#60A5FA" opacity="0.8"/>
      <path d="M 86 8 L 86 16 M 82 12 L 90 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
