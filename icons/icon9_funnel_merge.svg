<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="funnelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="flowSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="24" y="24" width="208" height="208" rx="44" fill="url(#funnelBg)" stroke="#334155" stroke-width="4"/>

  <!-- Top 2 Independent Floating Windows (Sources) -->
  <!-- Window 1 (Top Left) -->
  <rect x="50" y="52" width="64" height="42" rx="10" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="56" y="58" width="24" height="6" rx="3" fill="#94A3B8"/>
  <circle cx="102" cy="61" r="3" fill="#64748B"/>

  <!-- Window 2 (Top Right) -->
  <rect x="142" y="52" width="64" height="42" rx="10" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="148" y="58" width="24" height="6" rx="3" fill="#94A3B8"/>
  <circle cx="194" cy="61" r="3" fill="#64748B"/>

  <!-- Dynamic Merging Flow Streams (Funnels) -->
  <!-- Left flow pouring into bottom window -->
  <path d="M 82 94 C 82 122 108 132 112 148" fill="none" stroke="url(#flowEmerald)" stroke-width="6" stroke-linecap="round"/>
  <!-- Right flow pouring into bottom window -->
  <path d="M 174 94 C 174 122 148 132 144 148" fill="none" stroke="url(#flowSky)" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Convergence Node -->
  <circle cx="128" cy="138" r="8" fill="#F8FAFC"/>
  <circle cx="128" cy="138" r="4" fill="#0284C7"/>

  <!-- Bottom Unified Single Window with Tabs -->
  <rect x="42" y="152" width="172" height="58" rx="14" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <line x1="42" y1="176" x2="214" y2="176" stroke="#475569" stroke-width="2"/>

  <!-- Tab 1 (Left Merged Tab) -->
  <rect x="50" y="158" width="50" height="18" rx="6" fill="#059669"/>
  <rect x="58" y="164" width="26" height="5" rx="2.5" fill="#FFFFFF"/>

  <!-- Tab 2 (Right Merged Tab) -->
  <rect x="106" y="158" width="50" height="18" rx="6" fill="#0284C7"/>
  <rect x="114" y="164" width="26" height="5" rx="2.5" fill="#FFFFFF"/>

  <!-- Tab '+' symbol -->
  <circle cx="170" cy="167" r="6" fill="#475569"/>
  <path d="M 170 163 L 170 171 M 166 167 L 174 167" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
</svg>
