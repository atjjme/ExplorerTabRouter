<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="monoFolderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pathGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Monoline Folder Outer Contour -->
  <!-- Rounded corner folder shape: tab on top-left, dips and goes across, round body -->
  <path d="M 40 84 C 40 68 52 56 68 56 L 102 56 C 111 56 119 61 124 68 L 136 84 L 196 84 C 212 84 224 96 224 112 L 224 188 C 224 204 212 216 196 216 L 68 216 C 52 216 40 204 40 188 Z"
        fill="none" stroke="url(#monoFolderGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horizontal Tab Bar / Divider Line -->
  <line x1="40" y1="112" x2="224" y2="112" stroke="url(#monoFolderGrad)" stroke-width="12"/>

  <!-- Inside Tab 1 (Base Tab on folder ear) -->
  <line x1="108" y1="56" x2="108" y2="112" stroke="url(#monoFolderGrad)" stroke-width="10"/>
  <circle cx="74" cy="84" r="8" fill="#38BDF8"/>

  <!-- Inside Tab 2 (Target Routed Tab on right) -->
  <line x1="168" y1="84" x2="168" y2="112" stroke="url(#monoFolderGrad)" stroke-width="10"/>
  <!-- Tab 2 active indicator dot -->
  <circle cx="196" cy="98" r="5" fill="#6366F1"/>

  <!-- Single Continuous Flowing Route Path -->
  <!-- Entering from outside/bottom-left, looping gracefully in the folder belly, and pointing up to Tab 2 -->
  <path d="M 76 182 C 76 146 112 140 146 140 C 178 140 188 158 188 174 C 188 190 170 196 148 196 C 122 196 116 178 116 160 L 116 128"
        fill="none" stroke="url(#pathGrad1)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Arrowhead directly pointing into the Tab 2 region -->
  <polygon points="116,116 106,132 126,132" fill="#06B6D4"/>

  <!-- Flow Origin Pulse / External Node -->
  <circle cx="76" cy="182" r="5" fill="#38BDF8"/>
</svg>
