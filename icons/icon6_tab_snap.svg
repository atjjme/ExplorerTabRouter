<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="tabMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tabIncomingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="snapGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#snapGlow)">
    <!-- Base Window Header Platform -->
    <rect x="28" y="112" width="200" height="96" rx="20" fill="#1E293B" stroke="#334155" stroke-width="3"/>
    <line x1="28" y1="148" x2="228" y2="148" stroke="#334155" stroke-width="2"/>

    <!-- Left Tab (Firmly in place) -->
    <path d="M 44 148 L 44 76 C 44 68 50 62 58 62 L 116 62 C 124 62 130 68 130 76 L 130 148 Z" fill="url(#tabMainGrad)"/>
    <rect x="58" y="82" width="40" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="58" y="96" width="24" height="4" rx="2" fill="#93C5FD"/>

    <!-- Right Tab (Snapping in like magnetic dock) -->
    <!-- Positioned with a slight snap gap showing dynamic suction/docking -->
    <path d="M 136 148 L 136 76 C 136 68 142 62 150 62 L 208 62 C 216 62 222 68 222 76 L 222 148 Z" fill="url(#tabIncomingGrad)"/>
    <rect x="150" y="82" width="40" height="6" rx="3" fill="#FFFFFF"/>
    <circle cx="204" cy="85" r="4" fill="#E0F2FE"/>

    <!-- Magnetic Snap Particles / Spark between tabs -->
    <g transform="translate(133, 105)">
      <circle cx="0" cy="-24" r="3.5" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="0" cy="24" r="3.5" fill="#38BDF8"/>
      <!-- Snap force lines -->
      <path d="M -6 -8 C -2 -8, -2 8, -6 8 M 6 -8 C 2 -8, 2 8, 6 8" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Lower window preview lines -->
    <rect x="52" y="168" width="56" height="14" rx="4" fill="#334155"/>
    <rect x="118" y="168" width="86" height="14" rx="4" fill="#334155" opacity="0.6"/>
  </g>
</svg>
