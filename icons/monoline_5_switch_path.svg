<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="stepArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Rect Frame -->
  <rect x="36" y="44" width="184" height="168" rx="28"
        fill="none" stroke="url(#stepGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Tab Dividing Line -->
  <line x1="36" y1="96" x2="220" y2="96" stroke="url(#stepGrad)" stroke-width="12"/>

  <!-- Dual Tab Slots -->
  <line x1="124" y1="44" x2="124" y2="96" stroke="url(#stepGrad)" stroke-width="12"/>

  <!-- Tab 1 Circle Node -->
  <circle cx="80" cy="70" r="9" fill="#38BDF8"/>

  <!-- Tab 2 Add/Routed Plus -->
  <path d="M 172 61 L 172 79 M 163 70 L 181 70" stroke="#10B981" stroke-width="7" stroke-linecap="round"/>

  <!-- Step Circuit Geometric Route Path -->
  <!-- Clean rounded-corner 90-degree step line from bottom-left up to the right tab -->
  <path d="M 68 184 L 118 184 C 130 184 140 174 140 162 L 140 142 C 140 130 150 120 162 120 L 172 120 L 172 108"
        fill="none" stroke="url(#stepArrowGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upward Arrowhead directly into Tab 2 -->
  <polygon points="172,98 161,116 183,116" fill="#10B981"/>

  <!-- Origin Indicator Dot -->
  <circle cx="68" cy="184" r="6" fill="#F59E0B"/>
</svg>
