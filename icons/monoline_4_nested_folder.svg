<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="folderLineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="arrowGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Monoline Folder Body (Alternative Modern Asymmetric Cut) -->
  <!-- Classic Folder silhouette with clean lines -->
  <path d="M 44 92 C 44 76 56 64 72 64 L 106 64 C 116 64 122 70 128 78 L 138 92 L 200 92 C 214 92 224 102 224 116 L 224 192 C 224 206 214 216 200 216 L 72 216 C 56 216 44 204 44 192 Z"
        fill="none" stroke="url(#folderLineGrad2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Inner Tabs Frame -->
  <!-- Tab 1 (Left Folder Ear) -->
  <rect x="66" y="112" width="54" height="28" rx="8" fill="none" stroke="url(#folderLineGrad2)" stroke-width="8"/>
  <circle cx="82" cy="126" r="4" fill="#38BDF8"/>

  <!-- Tab 2 (Target Right Tab) -->
  <rect x="130" y="112" width="64" height="28" rx="8" fill="none" stroke="#06B6D4" stroke-width="8"/>
  <line x1="152" y1="126" x2="178" y2="126" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"/>

  <!-- Clean Direct Pierce-Through Routing Path -->
  <!-- Starting outside, crossing the folder threshold, and shooting up to Tab 2 -->
  <path d="M 66 188 L 124 188 C 146 188 162 172 162 150 L 162 142"
        fill="none" stroke="url(#arrowGrad2)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dynamic Piercing Arrowhead -->
  <polygon points="162,130 152,148 172,148" fill="#10B981"/>

  <!-- External entry point beacon -->
  <circle cx="66" cy="188" r="6" fill="#10B981"/>
</svg>
